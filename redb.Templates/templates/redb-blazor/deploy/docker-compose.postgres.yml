# The site with PostgreSQL instead of SQLite.
# Before the first run, switch the provider in code (see the comment in Program.cs):
#   RedbBlazor.csproj: redb.SQLite.Pro  ->  redb.Postgres.Pro
#   Program.cs:       .UseSqlite(...)  ->  .UsePostgres(connectionString)
# Then from the project folder: docker compose -f deploy/docker-compose.postgres.yml up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: redb
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: redb_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redb -d redb_app"]
      interval: 5s
      retries: 10

  app:
    build: ..
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Redb: "Host=db;Port=5432;Username=redb;Password=change_me;Database=redb_app;Pooling=true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
