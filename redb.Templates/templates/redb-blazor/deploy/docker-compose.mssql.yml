# The site with SQL Server instead of SQLite.
# Before the first run, switch the provider in code (see the comment in Program.cs):
#   RedbBlazor.csproj: redb.SQLite.Pro  ->  redb.MSSql.Pro
#   Program.cs:       .UseSqlite(...)  ->  .UseMsSql(connectionString)
# RedBase creates its tables but not the database: create redb_app once, for example
#   docker compose -f deploy/docker-compose.mssql.yml up -d db
#   docker compose -f deploy/docker-compose.mssql.yml exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Change_me_123" -Q "CREATE DATABASE redb_app"
# Then: docker compose -f deploy/docker-compose.mssql.yml up --build
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Change_me_123"
    volumes:
      - mssqldata:/var/opt/mssql

  app:
    build: ..
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Redb: "Server=db,1433;Database=redb_app;User Id=sa;Password=Change_me_123;TrustServerCertificate=true"
    depends_on:
      - db

volumes:
  mssqldata:
