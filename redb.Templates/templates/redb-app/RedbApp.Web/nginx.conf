# The client as static files, and the API behind the same origin: the browser sees one address, so no
# CORS is needed. "api" is the API's service name in deploy/docker-compose*.yml.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:5092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (/products/12, /categories) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
