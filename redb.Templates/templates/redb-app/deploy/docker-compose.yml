# The API in its own host with SQLite, and the client behind nginx on one origin.
# From the project folder:
#   cp deploy/.env.example deploy/.env      # then set APP_SIGNING_KEY and APP_ADMIN_PASSWORD
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080 and sign in as admin.
services:
  api:
    build:
      context: ..
      dockerfile: RedbApp.Host/Dockerfile
    environment:
      Tsak__Contexts__redbapp__Override__Auth__SigningKey: ${APP_SIGNING_KEY:?APP_SIGNING_KEY required}
      Tsak__Contexts__redbapp__Override__Auth__Users__admin__Password: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD required}
    volumes:
      - apidata:/data

  web:
    build:
      context: ..
      dockerfile: RedbApp.Web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  apidata:
