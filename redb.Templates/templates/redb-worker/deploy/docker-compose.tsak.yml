# The module on a Tsak worker: the Tsak stack image (worker and dashboard in one container) loads
# RedbWorker.tpkg from deploy/output. The worker's default redb is SQLite, so nothing else is needed.
#
# From the project folder:
#   cp deploy/.env.example deploy/.env          # then fill in the four Tsak values
#   pwsh deploy/pack-tpkg.ps1                   # -> deploy/output/RedbWorker.tpkg
#   docker compose -f deploy/docker-compose.tsak.yml up -d
#
# Then put a file from samples/ into runtime/inbox; the receipt arrives in runtime/outbox.
# Dashboard: http://localhost:8085 (admin and TSAK_WEB_ADMIN_PASSWORD).

services:
  tsak:
    image: ghcr.io/redbase-app/redb-tsak-stack:${TSAK_VERSION:-4.2.0-net10}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"   # worker API
      - "127.0.0.1:8085:8085"   # dashboard
    environment:
      # The worker's default (unnamed) redb, the one the module works in. The same settings as the own
      # host: Pro, change tracking, the PVT prefilter. The props cache stays off; to turn it on add
      # Tsak__Redb__EnablePropsCache=true.
      - Tsak__Redb__UsePro=true
      - Tsak__Redb__PropsSaveStrategy=ChangeTracking
      - Tsak__Redb__EnablePvtPrefilter=true

      - Tsak__Modules__AssemblyPaths__0=/app/modules
      - Tsak__Cluster__ApiEndpoint=http://tsak:9090
      - Tsak__Cluster__NodeId=redbworker-1

      # The worker's API requires a key; the dashboard in the same container calls it with the service key.
      # The worker stores only the key's hash: HMAC-SHA256 of the key with Tsak:Auth:Secret (see .env.example).
      - Tsak__Auth__Enabled=true
      - Tsak__Auth__Secret=${TSAK_AUTH_SECRET:?TSAK_AUTH_SECRET required}
      - Tsak__Auth__Keys__0__Id=svc-tsak-web
      - Tsak__Auth__Keys__0__KeyHash=${TSAK_WEB_API_KEY_HASH:?TSAK_WEB_API_KEY_HASH required}
      - Tsak__Auth__Keys__0__Name=tsak-web-dashboard
      - Tsak__Auth__Keys__0__Roles=admin
      - Tsak__Web__AdminLogin=admin
      - Tsak__Web__AdminPassword=${TSAK_WEB_ADMIN_PASSWORD:?TSAK_WEB_ADMIN_PASSWORD required}
      - Tsak__Web__ServiceApiKey=${TSAK_WEB_API_KEY:?TSAK_WEB_API_KEY required}
      - Tsak__Web__Mode=cluster

      # The module's folders: the Override layer of its context, the same keys the own host reads.
      - Tsak__Contexts__redbworker__Override__Folders__Inbox=/data/inbox
      - Tsak__Contexts__redbworker__Override__Folders__Outbox=/data/outbox
      - Tsak__Contexts__redbworker__Override__Folders__Archive=/data/archive
      - Tsak__Contexts__redbworker__Override__Folders__Error=/data/error
    volumes:
      - ./output:/app/modules
      # On Linux the folder must be writable by the container's user.
      - ../runtime:/data
