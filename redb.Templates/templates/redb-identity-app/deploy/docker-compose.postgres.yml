# PostgreSQL instead of SQLite, on top of docker-compose.yml. From the project folder:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml up -d --build
#
# One database for Identity and the module. Identity is several Tsak contexts, and each one opens its
# own redb instance: all of them have to point at the same store (the DataProtection key ring lives
# there), so every context gets the override, the ones that do not start included. The module works in
# the worker's default redb (Tsak__Redb__*).

x-identity-pg: &identity-pg "Host=db;Port=5432;Username=redb;Password=change_me;Database=redb_identity_app;Pooling=true"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: redb
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: redb_identity_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redb -d redb_identity_app"]
      interval: 5s
      retries: 10

  identity:
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The image runs the worker in cluster mode; with a database server the Quartz job store is shared
      # and must be clustered too, even for one node.
      Quartz__quartz.jobStore.clustered: "true"
      # The worker's default redb: the module's notes.
      Tsak__Redb__Provider: postgres
      ConnectionStrings__Postgres: *identity-pg
      # Every Identity context on the same store.
      Tsak__Contexts__identity.contracts__Override__RedbInstanceName: identity-pg
      Tsak__Contexts__identity.contracts__Override__Redb__identity-pg__ConnectionString: *identity-pg
      Tsak__Contexts__identity.core__Override__RedbInstanceName: identity-pg
      Tsak__Contexts__identity.core__Override__Identity__RedbInstanceName: identity-pg
      Tsak__Contexts__identity.core__Override__Redb__identity-pg__ConnectionString: *identity-pg
      Tsak__Contexts__identity.http__Override__RedbInstanceName: identity-pg
      Tsak__Contexts__identity.http__Override__Redb__identity-pg__ConnectionString: *identity-pg
      Tsak__Contexts__identity.grpc__Override__RedbInstanceName: identity-pg
      Tsak__Contexts__identity.grpc__Override__Redb__identity-pg__ConnectionString: *identity-pg
      Tsak__Contexts__identity.soap__Override__RedbInstanceName: identity-pg
      Tsak__Contexts__identity.soap__Override__Redb__identity-pg__ConnectionString: *identity-pg

volumes:
  pgdata:
