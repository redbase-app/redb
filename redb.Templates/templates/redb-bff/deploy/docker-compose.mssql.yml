# The backend with SQL Server instead of SQLite, and the web server.
# Before the first run, switch the provider in code (see the comment in RedbBff.Host/Program.cs):
#   RedbBff.Host.csproj: redb.SQLite.Pro  ->  redb.MSSql.Pro
#   Program.cs:          .UseSqlite(...)  ->  .UseMsSql(connectionString)
# RedBase creates its tables but not the database: create redb_app once, for example
#   docker compose -f deploy/docker-compose.mssql.yml up -d db
#   docker compose -f deploy/docker-compose.mssql.yml exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Change_me_123" -Q "CREATE DATABASE redb_app"
# Then (deploy/.env as for docker-compose.yml): docker compose -f deploy/docker-compose.mssql.yml up --build
# Then open http://localhost:8080.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Change_me_123"
    volumes:
      - mssqldata:/var/opt/mssql

  backend:
    build:
      context: ..
      dockerfile: RedbBff.Host/Dockerfile
    environment:
      ConnectionStrings__Redb: "Server=db,1433;Database=redb_app;User Id=sa;Password=Change_me_123;TrustServerCertificate=true"
      Tsak__Contexts__redbbff__Override__Api__ServiceKey: ${BFF_SERVICE_KEY:?BFF_SERVICE_KEY required}
    depends_on:
      - db

  web:
    build:
      context: ..
      dockerfile: RedbBff.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Backend__BaseUrl: "http://backend:5093/"
      Backend__ServiceKey: ${BFF_SERVICE_KEY:?BFF_SERVICE_KEY required}
      Web__Users__admin__Password: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD required}
    depends_on:
      - backend

volumes:
  mssqldata:
