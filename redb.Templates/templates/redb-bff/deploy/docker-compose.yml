# The backend in its own host with SQLite, and the web server. Only the web server is published; the
# backend is reachable inside the compose network alone.
# From the project folder:
#   cp deploy/.env.example deploy/.env      # then set BFF_SERVICE_KEY and APP_ADMIN_PASSWORD
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080 and sign in as admin.
services:
  backend:
    build:
      context: ..
      dockerfile: RedbBff.Host/Dockerfile
    environment:
      Tsak__Contexts__redbbff__Override__Api__ServiceKey: ${BFF_SERVICE_KEY:?BFF_SERVICE_KEY required}
    volumes:
      - backenddata:/data

  web:
    build:
      context: ..
      dockerfile: RedbBff.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Backend__BaseUrl: "http://backend:5093/"
      Backend__ServiceKey: ${BFF_SERVICE_KEY:?BFF_SERVICE_KEY required}
      Web__Users__admin__Password: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD required}
    depends_on:
      - backend

volumes:
  backenddata:
